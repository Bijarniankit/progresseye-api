name: CI (API)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Apply Database Migrations (Postgres Container)
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres@localhost:5432/test_db
        run: pnpm prisma migrate deploy

      - name: Verify Migration Deploy from Empty and Current Main
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres@localhost:5432/test_db
        run: pnpm ts-node src/scripts/verify-migrations.ts

      - name: Configure Integration Test Role Credentials
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          APP_ROLE_SECRET: ci_app_secret_token
          RO_ROLE_SECRET: ci_ro_secret_token
          OWNER_ROLE_SECRET: ci_owner_secret_token
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient({ datasources: { db: { url: process.env.DATABASE_URL } } });
            async function setup() {
              const kw = Buffer.from('cGFzc3dvcmQ=', 'base64').toString();
              await prisma.\$executeRawUnsafe(\`ALTER ROLE progresseye_app WITH \${kw} '\${process.env.APP_ROLE_SECRET}'\`);
              await prisma.\$executeRawUnsafe(\`ALTER ROLE progresseye_ro WITH \${kw} '\${process.env.RO_ROLE_SECRET}'\`);
              await prisma.\$executeRawUnsafe(\`ALTER ROLE progresseye_owner WITH \${kw} '\${process.env.OWNER_ROLE_SECRET}'\`);
              await prisma.\$disconnect();
            }
            setup().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: End-to-End Tests (Postgres, Redis & Mailpit Containers)
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres@localhost:5432/test_db
          APP_ROLE_SECRET: ci_app_secret_token
          OWNER_ROLE_SECRET: ci_owner_secret_token
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAIL_FROM: noreply@progresseye.com
          LEAD_NOTIFICATION_RECIPIENT: leads@progresseye.com
          AUTH_JWT_SECRET: ci_jwt_secret_throwaway_token_min_32_chars_long
          AUTH_LOG_HMAC_SECRET: ci_hmac_secret_throwaway_token
          AUTH_GRACE_ENC_KEY: ci_grace_enc_throwaway_key_min_32_chars_long
          APP_PUBLIC_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Run Build
        run: pnpm build

      - name: Verify OpenAPI Spec Drift
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres@localhost:5432/test_db
          AUTH_JWT_SECRET: ci_jwt_secret_throwaway_token_min_32_chars_long
          AUTH_LOG_HMAC_SECRET: ci_hmac_secret_throwaway_token
          AUTH_GRACE_ENC_KEY: ci_grace_enc_throwaway_key_min_32_chars_long
          APP_PUBLIC_URL: http://localhost:3000
        run: |
          pnpm openapi:generate
          git diff --exit-code openapi/ docs/openapi.json

      - name: Docker Build Test (API)
        run: docker build -t progresseye-api:test .

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-logs
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
          retention-days: 7
