name: CI (API)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Apply Database Migrations (Postgres Container)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
        run: pnpm prisma migrate deploy

      - name: End-to-End Tests (Postgres & Redis Containers)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm test:e2e

      - name: Run Build
        run: pnpm build

      - name: Verify OpenAPI Spec Drift
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/test_db
        run: |
          pnpm openapi:generate
          git diff --exit-code openapi/

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-logs
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
          retention-days: 7
